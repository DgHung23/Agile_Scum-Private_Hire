# PrivateHire Cars - local infrastructure
# Postgres is published on 5433 (not 5432) so it never clashes with other local Postgres containers.
name: privatehire

services:
  db:
    image: postgres:16-alpine
    container_name: privatehire-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: privatehire
      POSTGRES_PASSWORD: privatehire_dev
      POSTGRES_DB: privatehire
    ports:
      - "5433:5432"
    volumes:
      - privatehire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privatehire -d privatehire"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test email inbox (report Appendix K: "Mailpit test inbox in Docker for demonstrations").
  # Every email the system sends (confirmations, receipts with the PDF attached) lands here: http://localhost:8025
  # Local dev: docker compose --profile mail up -d mail, then set SMTP_HOST=localhost in server/.env
  mail:
    profiles: ["mail", "full"]
    image: axllent/mailpit:v1.21
    container_name: privatehire-mail
    restart: unless-stopped
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP

  # Full stack in one container (API + built web app). Start with:  docker compose --profile full up --build
  app:
    profiles: ["full"]
    build: .
    container_name: privatehire-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://privatehire:privatehire_dev@db:5432/privatehire
      PORT: "4000"
      NODE_ENV: production
      SEED_ON_START: "demo"
      PUBLIC_URL: http://localhost:4000
      SMTP_HOST: mail
      SMTP_PORT: "1025"
    ports:
      - "4000:4000"

volumes:
  privatehire_pgdata:
